<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>FORGEX — لوحة الإدارة</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/forge.css">
<link rel="stylesheet" href="/admin.css">
<script src="/i18n.js"></script>
</head>
<body class="adm-body">
<div class="bgfx" aria-hidden="true"><i class="grid"></i><i class="scan"></i></div>
<div id="toast" role="status"></div>

<main class="adm" id="login" hidden>
  <form class="acard plate brk in" id="lf" novalidate aria-labelledby="lt">
    <div class="scanline" aria-hidden="true"></div>
    <img src="/assets/logo-t.png" alt="" class="alogo"><h1 id="lt">لوحة إدارة FORGEX</h1><p class="sub">دخول مالك الموقع فقط.</p>
    <label>الإيميل<input id="le" type="email" autocomplete="username" maxlength="120" dir="ltr" required></label>
    <label>كلمة المرور<input id="lp" type="password" autocomplete="current-password" maxlength="128" dir="ltr" required></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn pri wide" id="lsub" type="submit"><span id="lsl">دخول</span><i class="spin" aria-hidden="true"></i></button>
    <button class="btn wide" type="button" data-lang-toggle data-no-i18n aria-label="Language"><span class="ll">EN</span></button><a class="btn wide" href="/"><span>العودة للموقع</span></a>
  </form>
</main>

<main class="adm" id="app" hidden>
  <div class="bar2"><div><span class="mono idx" dir="ltr">CONTROL PANEL</span><h1>لوحة الإدارة</h1></div>
    <div class="row"><button class="btn" type="button" data-lang-toggle data-no-i18n aria-label="Language"><span class="ll">EN</span></button><a class="btn" href="/"><span>الموقع</span></a><button class="btn" id="lo" type="button"><span>خروج</span></button></div></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="panel plate brk" id="addp">
    <h2 id="addt"></h2>
    <form id="af" novalidate class="fgrid">
      <label>الاسم<input id="fn" maxlength="120" required></label>
      <label>التصنيف (اختياري)<input id="fc" maxlength="40"></label>
      <label class="full">الشرح<textarea id="fd" rows="4" maxlength="4000" required></textarea></label>
      <label>صورة الغلاف (PNG / JPG / WEBP — حتى 5MB)<input id="fi" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <label><span id="flab">ملف التحميل</span><input id="ff" type="file"></label>
      <label class="full">أو رابط تحميل خارجي (https://)<input id="fl" type="url" maxlength="500" dir="ltr"></label>
      <div class="full"><div class="up" id="upw" hidden><i id="upb"></i></div><div class="up-t mono" id="upt" dir="ltr"></div><div class="err" id="aerr" role="alert"></div>
        <button class="btn pri" id="asub" type="submit"><span>إضافة</span><i class="spin" aria-hidden="true"></i></button></div>
    </form>
  </section>
  <section id="members" hidden><div class="mhead plate"><b id="mcount" class="mono"></b><span class="sub">أعضاء الموقع المسجّلون (محفوظون في قاعدة D1 على Cloudflare)</span></div><div id="mlist"></div></section>
  <section id="items"></section>
</main>
<script src="/admin.js"></script>
</body>
</html>
